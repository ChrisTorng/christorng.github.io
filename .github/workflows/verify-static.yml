name: Verify Static UI
on:
  pull_request:
    paths:
      - 'app/**'
      - 'data/projectsData.ts'
      - 'data/projectUpdatedDates.json'
      - 'scripts/refresh-project-dates.mjs'
      - 'tests/projects-listing.test.mjs'
      - 'components/**'
      - 'public/shared/**'
      - 'utils/admin-math.mjs'
      - 'utils/rss*.mjs'
      - 'tests/rss-math.test.mjs'
      - 'scripts/build-admin-math.mjs'
      - 'tests/admin-math.test.mjs'
      - 'public/bookmarks/**'
      - 'public/notes/**'
      - 'tests/redirect-options.test.mjs'
      - 'tests/mobile-editor-layout.test.mjs'
      - 'tests/quick-capture.test.mjs'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-static.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/redirect-options.test.mjs tests/mobile-editor-layout.test.mjs tests/quick-capture.test.mjs tests/projects-listing.test.mjs tests/admin-math.test.mjs tests/rss-math.test.mjs
      - run: npm run build
        env:
          EXPORT: '1'
          UNOPTIMIZED: '1'
          BASE_PATH: ''
      - name: Check generated static UI
        run: |
          test -f out/bookmarks/index.html
          test -f out/bookmarks/admin/index.html
          test -f out/bookmarks/admin/quick/index.html
          test -f out/bookmarks/view/index.html
          test -f out/notes/index.html
          test -f out/notes/editor/index.html
          test -f out/notes/view/index.html
          test -s out/shared/math-v1/admin-math.mjs
          test -s out/shared/math-v1/katex.min.css
          test -s out/shared/math-v1/fonts/KaTeX_Main-Regular.woff2
