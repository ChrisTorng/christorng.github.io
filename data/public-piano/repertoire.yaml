  - composer: 李斯特
    title: 鐘
    originalComposer: Franz Liszt
    originalTitle: La campanella
    favorite: 4.5
    difficulty: 4
    proficiency: 3
    description: >-
      極度困難又花俏的曲子。我的程度遠遠不及，手也太小。整首錯誤百出，很多卡住又得重彈，在此現醜了。但彈完後不時有人問我是否是音樂系教授，可見此曲之困難度！
    recordings:
      # - label: '2026/3/28 錄影 (那時還比較不熟，現在稍微快一點):'
      #   component: VideoPlayer
      #   title: 李斯特 - 鐘 (Liszt - La campanella) 開頭一小段
      #   src: /static/videos/2026/my-piano/la-campanella-opening.mp4
